[project]
name = "vault-mcp"
version = "0.1.0"
description = "MCP server exposing an Obsidian knowledge-base vault as agent context"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.4.0",
    "python-frontmatter>=1.1.0",
]

[project.scripts]
vault-mcp = "vault_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault_mcp"]
